<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Join a group — Node Expense</title>
<meta name="description" content="You're invited to a group on Node Expense: Track Together.">
<link rel="icon" type="image/png" href="../assets/icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Node Expense">
<meta property="og:title" content="You're invited to a group on Node Expense">
<meta property="og:description" content="Split bills with friends. Tap to join the group.">
<meta property="og:image" content="https://dizzydogstudio.github.io/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="../assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Self-hosted — see assets/fonts/OFL.txt. No third-party font requests. */
  @font-face {
    font-family: 'Inter'; font-style: normal; font-weight: 100 900;
    font-display: swap; src: url('../assets/fonts/inter.woff2') format('woff2');
  }
  :root {
    --bg: #f7f7f9; --surface: #ffffff; --ink: #18181b; --ink-muted: #6b7280;
    --indigo: #4f46e5; --accent-light: #f1f0fe; --border: #ececef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f12; --surface: #1a1a1f; --ink: #f4f4f5; --ink-muted: #a1a1aa;
      --indigo: #6366f1; --accent-light: #23224a; --border: #2a2a31;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif; font-size: 15px; line-height: 1.6;
    min-height: 100vh; -webkit-font-smoothing: antialiased;
    display: flex; align-items: flex-start; justify-content: center; padding: 48px 16px;
  }
  main {
    width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 32px 24px; text-align: center;
  }
  .icon { width: 72px; height: 72px; border-radius: 16px; margin: 0 auto 16px; display: block; }
  h1 { font-size: 22px; line-height: 1.3; font-weight: 700; margin-bottom: 6px; overflow-wrap: anywhere; }
  .sub { color: var(--ink-muted); margin-bottom: 28px; }
  .step { text-align: left; border-top: 1px solid var(--border); padding: 20px 0 4px; }
  .step h2 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .step p { color: var(--ink-muted); font-size: 14px; }
  .dl { display: inline-flex; align-items: center; gap: 11px; background: var(--indigo); color: #fff;
        padding: 12px 24px; border-radius: 13px; text-decoration: none; margin: 4px 0 12px; }
  .dl svg { width: 24px; height: 24px; fill: #fff; flex: none; }
  .dl small { display: block; font-size: 10.5px; opacity: .85; line-height: 1.1; }
  .dl b { display: block; font-size: 16px; font-weight: 600; line-height: 1.2; }
  .code-row { display: flex; gap: 10px; align-items: center; margin: 12px 0 8px; }
  .code { flex: 1; font-size: 26px; font-weight: 700; letter-spacing: .12em; text-align: center;
          background: var(--accent-light); color: var(--ink); border-radius: 12px; padding: 10px 8px;
          font-variant-numeric: tabular-nums; overflow-wrap: anywhere; user-select: all; }
  button.copy { font: inherit; font-size: 14px; font-weight: 600; color: var(--indigo); background: none;
                border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
  .note { margin-top: 20px; font-size: 13px; color: var(--ink-muted); }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <img class="icon" src="../assets/icon.png" alt="">
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>

  <section class="step">
    <h2 id="s1"></h2>
    <a class="dl" href="https://apps.apple.com/app/node-expense-track-together/id6759304601">
      <svg viewBox="0 0 384 512" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
      <span><small id="dlSmall"></small><b>App Store</b></span>
    </a>
  </section>

  <section class="step" id="codeStep">
    <h2 id="s2"></h2>
    <p id="s2body"></p>
    <div class="code-row">
      <div class="code" id="code"></div>
      <button class="copy" id="copy" type="button"></button>
    </div>
  </section>

  <section class="step hidden" id="noCodeStep">
    <p id="noCode"></p>
  </section>

  <p class="note" id="note"></p>
</main>

<script>
(function () {
  // Group invite landing page. The app shares
  //   https://dizzydogstudio.github.io/join/#c=CODE&n=GroupName
  // With Node Expense installed, iOS/macOS opens the app instead of this page
  // (see /.well-known/apple-app-site-association). The code and name live in
  // the URL fragment, which is never sent to the server.
  var T = {
    en: {
      titleNamed: 'You’re invited to join “{n}”', title: 'You’re invited to a group',
      sub: 'Split bills with friends on Node Expense.',
      s1: '1. Get Node Expense', dlSmall: 'Download on the',
      s2: '2. Join the group',
      s2body: 'After installing, tap your invite link again. Or open the app, go to Groups → Join Group and enter this code:',
      copy: 'Copy', copied: 'Copied',
      noCode: 'This invite link is missing its code. Ask the person who invited you to send it again.',
      note: 'Already have the app? This link opens it on iPhone, iPad and Mac.'
    },
    de: {
      titleNamed: 'Du bist eingeladen: „{n}“', title: 'Du bist zu einer Gruppe eingeladen',
      sub: 'Teile Rechnungen mit Freunden in Node Expense.',
      s1: '1. Node Expense laden', dlSmall: 'Laden im',
      s2: '2. Der Gruppe beitreten',
      s2body: 'Tippe nach der Installation erneut auf deinen Einladungslink. Oder öffne die App, gehe zu Gruppen → Gruppe beitreten und gib diesen Code ein:',
      copy: 'Kopieren', copied: 'Kopiert',
      noCode: 'In diesem Einladungslink fehlt der Code. Bitte die Person, die dich eingeladen hat, ihn noch einmal zu senden.',
      note: 'App schon installiert? Dieser Link öffnet sie auf iPhone, iPad und Mac.'
    },
    es: {
      titleNamed: 'Te invitaron a unirte a “{n}”', title: 'Te invitaron a un grupo',
      sub: 'Divide gastos con amigos en Node Expense.',
      s1: '1. Descarga Node Expense', dlSmall: 'Descargar en el',
      s2: '2. Únete al grupo',
      s2body: 'Después de instalarla, vuelve a tocar tu enlace de invitación. O abre la app, ve a Grupos → Unirse al grupo e introduce este código:',
      copy: 'Copiar', copied: 'Copiado',
      noCode: 'A este enlace de invitación le falta el código. Pídele a quien te invitó que te lo envíe de nuevo.',
      note: '¿Ya tienes la app? Este enlace la abre en iPhone, iPad y Mac.'
    },
    fr: {
      titleNamed: 'Vous êtes invité à rejoindre « {n} »', title: 'Vous êtes invité dans un groupe',
      sub: 'Partagez les dépenses entre amis avec Node Expense.',
      s1: '1. Installez Node Expense', dlSmall: 'Télécharger dans l’',
      s2: '2. Rejoignez le groupe',
      s2body: 'Après l’installation, touchez à nouveau votre lien d’invitation. Ou ouvrez l’app, allez dans Groupes → Rejoindre le groupe et saisissez ce code :',
      copy: 'Copier', copied: 'Copié',
      noCode: 'Il manque le code dans ce lien d’invitation. Demandez à la personne qui vous a invité de vous le renvoyer.',
      note: 'Vous avez déjà l’app ? Ce lien l’ouvre sur iPhone, iPad et Mac.'
    },
    ja: {
      titleNamed: '「{n}」に招待されました', title: 'グループに招待されました',
      sub: 'Node Expense で友だちと割り勘。',
      s1: '1. Node Expense を入手', dlSmall: 'Download on the',
      s2: '2. グループに参加',
      s2body: 'インストール後、招待リンクをもう一度タップしてください。またはアプリを開き、「グループ」→「グループに参加」で次のコードを入力してください：',
      copy: 'コピー', copied: 'コピー済み',
      noCode: 'この招待リンクにはコードがありません。招待した人にもう一度送ってもらってください。',
      note: 'アプリをお持ちの場合、このリンクで iPhone、iPad、Mac のアプリが開きます。'
    },
    ko: {
      titleNamed: '“{n}” 그룹에 초대되었습니다', title: '그룹에 초대되었습니다',
      sub: 'Node Expense로 친구와 비용을 나눠 내세요.',
      s1: '1. Node Expense 받기', dlSmall: 'Download on the',
      s2: '2. 그룹 참가',
      s2body: '설치한 뒤 초대 링크를 다시 탭하세요. 또는 앱을 열고 그룹 → 그룹 참가에서 이 코드를 입력하세요:',
      copy: '복사', copied: '복사됨',
      noCode: '이 초대 링크에 코드가 없습니다. 초대한 사람에게 다시 보내 달라고 요청하세요.',
      note: '이미 앱이 있나요? 이 링크로 iPhone, iPad, Mac에서 앱이 열립니다.'
    },
    'zh-Hans': {
      titleNamed: '你受邀加入“{n}”', title: '你受邀加入一个群组',
      sub: '用 Node Expense 和朋友一起分账。',
      s1: '1. 下载 Node Expense', dlSmall: 'Download on the',
      s2: '2. 加入群组',
      s2body: '安装后，再点一次邀请链接。或打开 App，前往“群组”→“加入群组”，输入以下邀请码：',
      copy: '复制', copied: '已复制',
      noCode: '这个邀请链接缺少邀请码。请邀请你的人重新发送一次。',
      note: '已经安装了？这个链接会在 iPhone、iPad 和 Mac 上直接打开 App。'
    },
    'zh-Hant': {
      titleNamed: '你受邀加入「{n}」', title: '你受邀加入一個群組',
      sub: '用 Node Expense 和朋友一起分帳。',
      s1: '1. 下載 Node Expense', dlSmall: 'Download on the',
      s2: '2. 加入群組',
      s2body: '安裝後，再點一次邀請連結。或打開 App，前往「群組」→「加入群組」，輸入以下邀請碼：',
      copy: '複製', copied: '已複製',
      noCode: '這個邀請連結缺少邀請碼。請邀請你的人重新傳送一次。',
      note: '已經安裝了？這個連結會在 iPhone、iPad 和 Mac 上直接打開 App。'
    }
  };

  function pickLang() {
    var langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
    for (var i = 0; i < langs.length; i++) {
      var l = String(langs[i]).toLowerCase();
      if (l.indexOf('zh') === 0) {
        return (/hant|-tw|-hk|-mo/.test(l)) ? 'zh-Hant' : 'zh-Hans';
      }
      var base = l.split('-')[0];
      if (T[base]) return base;
    }
    return 'en';
  }

  function readPairs(s) {
    var out = {};
    if (!s) return out;
    s.replace(/^[#?]/, '').split('&').forEach(function (part) {
      var i = part.indexOf('=');
      if (i < 1) return;
      var k = part.slice(0, i), v = part.slice(i + 1).replace(/\+/g, '%20');
      if (out[k] !== undefined) return;
      try { out[k] = decodeURIComponent(v).trim(); } catch (e) { /* malformed — ignore */ }
    });
    return out;
  }

  var lang = pickLang(), t = T[lang];
  document.documentElement.lang = lang;
  var frag = readPairs(location.hash), query = readPairs(location.search);
  var code = frag.c || query.c || '', name = frag.n || query.n || '';

  function set(id, text) { document.getElementById(id).textContent = text; } // textContent: never HTML
  set('title', name ? t.titleNamed.replace('{n}', name) : t.title);
  set('sub', t.sub); set('s1', t.s1); set('dlSmall', t.dlSmall);
  set('s2', t.s2); set('s2body', t.s2body); set('copy', t.copy);
  set('noCode', t.noCode); set('note', t.note);
  document.title = (name ? t.titleNamed.replace('{n}', name) : t.title) + ' — Node Expense';

  if (code) {
    set('code', code);
  } else {
    document.getElementById('codeStep').classList.add('hidden');
    document.getElementById('noCodeStep').classList.remove('hidden');
  }

  document.getElementById('copy').addEventListener('click', function () {
    var btn = this;
    function done() { btn.textContent = t.copied; setTimeout(function () { btn.textContent = t.copy; }, 1800); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done, function () {});
    }
  });
})();
</script>
</body>
</html>
